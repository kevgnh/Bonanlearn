<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Inscription</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #7a4791, #a674bc);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .form-box {
            background: #fff;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.2);
            width: 360px;
            text-align: center;
            transition: transform 0.3s ease;
        }

        .form-box:hover {
            transform: translateY(-5px);
        }

        .form-box h2 {
            margin-bottom: 30px;
            color: #7a4791;
            font-size: 26px;
        }

        .form-box input {
            width: 100%;
            padding: 14px;
            margin-bottom: 18px;
            border: 2px solid #e0d4e8;
            border-radius: 8px;
            background: #f9f7fc;
            font-size: 16px;
            transition: border-color 0.3s;
        }

        .form-box input:focus {
            outline: none;
            border-color: #7a4791;
            background: #fff;
        }

        .form-box button {
            background: #7a4791;
            color: white;
            border: none;
            padding: 14px;
            width: 100%;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s ease;
        }

        .form-box button:hover {
            background: #67397a;
        }

        .form-box a {
            display: block;
            margin-top: 18px;
            font-size: 14px;
            color: #7a4791;
            text-decoration: none;
            transition: color 0.3s;
        }

        .form-box a:hover {
            color: #4e2d5f;
        }
    </style>
</head>
<body>
    <div class="form-box">
        <h2>Créer un compte</h2>
        <form method="POST" action="/verification">
            <input type="text" name="username" placeholder="Nom d'utilisateur"  required>
            <input type="email" name="email" placeholder="Adresse e-mail" required>
            <input type="password" name="password" placeholder="Mot de passe" required>
            <button type="submit">S'inscrire</button>
        </form>
        <a href="/login">Déjà un compte ? Se connecter</a>
    </div>
</body>
</html>
