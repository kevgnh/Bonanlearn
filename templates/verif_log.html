<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Vérification</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f3f3f3;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }

    .verif-box {
      background-color: white;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 0 20px rgba(0, 0, 0, 0.1);
      max-width: 400px;
      width: 100%;
    }

    h2 {
      color: #7a4791;
      text-align: center;
      margin-bottom: 20px;
    }

    input[type="text"] {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #ccc;
      margin-bottom: 20px;
      font-size: 16px;
    }

    button {
      width: 100%;
      padding: 12px;
      background-color: #7a4791;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }

    button:hover:enabled {
      background-color: #663879;
    }

    button:disabled {
      background-color: #b293c4;
      cursor: not-allowed;
    }

    .message {
      text-align: center;
      font-size: 14px;
      color: gray;
      margin-top: 10px;
    }

    .countdown {
      text-align: center;
      font-size: 16px;
      color: #7a4791;
      margin-top: 10px;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="verif-box">
    <h2>Entrez votre code</h2>
    <form method="POST" action="/trlogin">
      <input type="text" name="code_verif" placeholder="Code à 6 chiffres" required>
      <button type="submit">Valider</button>
    </form>
    <div class="message">
      Un code vous a été envoyé par email.
    </div>
    <div class="countdown" id="countdown">Temps restant : 01:30</div>
    <button id="resendBtn" disabled style="margin-top: 15px;">Renvoyer le code (01:30)</button>
  </div>

  <script>
    let timeLeft = 90; // 1 minute 30 secondes
    const countdownEl = document.getElementById('countdown');
    const resendBtn = document.getElementById('resendBtn');

    function updateCountdown() {
      if (timeLeft <= 0) {
        countdownEl.textContent = "Vous pouvez demander un nouveau code.";
        resendBtn.disabled = false;
        resendBtn.textContent = "Renvoyer le code";
        resendBtn.onclick = () => {
          location.href = 'verif_login';
        };
        return;
      }

      let min = Math.floor(timeLeft / 60);
      let sec = timeLeft % 60;
      sec = sec < 10 ? '0' + sec : sec;
      countdownEl.textContent = Temps restant : ${min}:${sec};
      resendBtn.textContent = Renvoyer le code (${min}:${sec});

      timeLeft--;
      setTimeout(updateCountdown, 1000);
    }

    updateCountdown();
  </script>
</body>
</html>
